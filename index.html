<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e4eef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#182027" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スライムうちまくれ！">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:14px/1.5 system-ui,sans-serif;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>スライムうちまくれ！</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
/* layout: one screen — name & next slime on top, the glass jar fills the middle, toy buttons along the bottom */
:root{
  --bg:#e4eef2;--bg-dot:rgba(90,130,150,.10);
  --ink:#2f3b45;--ink-soft:#64757f;
  --glass:rgba(255,255,255,.42);--glass-edge:rgba(255,255,255,.95);--glass-shade:rgba(80,120,140,.22);
  --lid:#b98a5e;--danger:#e0566a;--float:#2f3b45;--float-edge:#ffffff;
  --veil:rgba(228,238,242,.55);
  --cloth:#f7b3c8;--cloth-dot:#ffffff;--ribbon:#e8628f;--ribbon-dark:#c2416f;--glass-tint:rgba(255,205,225,.45);
  --btn:#ffffff;--btn-edge:#c9d8df;--btn-on:#ffe8a3;--label:#ffffff;--stitch:rgba(240,140,175,.55);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#182027;--bg-dot:rgba(160,200,220,.06);--ink:#e3edf2;--ink-soft:#93a5b0;
  --glass:rgba(160,200,230,.08);--glass-edge:rgba(200,230,250,.55);--glass-shade:rgba(0,0,0,.35);
  --lid:#7d5d40;--danger:#ff6f82;--float:#ffffff;--float-edge:#182027;--btn:#24303a;--btn-edge:#3a4a56;--btn-on:#5a4a1e;--label:#24303a;--stitch:rgba(224,122,160,.5);
  --veil:rgba(24,32,39,.6);--cloth:#a8607a;--cloth-dot:rgba(255,235,245,.75);--ribbon:#e07aa0;--ribbon-dark:#a84470;--glass-tint:rgba(255,150,190,.08);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#182027;--bg-dot:rgba(160,200,220,.06);--ink:#e3edf2;--ink-soft:#93a5b0;
  --glass:rgba(160,200,230,.08);--glass-edge:rgba(200,230,250,.55);--glass-shade:rgba(0,0,0,.35);
  --lid:#7d5d40;--danger:#ff6f82;--float:#ffffff;--float-edge:#182027;--btn:#24303a;--btn-edge:#3a4a56;--btn-on:#5a4a1e;--label:#24303a;--stitch:rgba(224,122,160,.5);
  --veil:rgba(24,32,39,.6);--cloth:#a8607a;--cloth-dot:rgba(255,235,245,.75);--ribbon:#e07aa0;--ribbon-dark:#a84470;--glass-tint:rgba(255,150,190,.08);color-scheme:dark}
html,body{height:100%}html{height:100dvh}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:var(--bg-pat,radial-gradient(var(--bg-dot) 1.5px,transparent 1.6px)),var(--bg-grad,linear-gradient(transparent,transparent));background-size:var(--bg-size,22px 22px),100% 100%;background-position:center;transition:background-color .6s}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header: sticker logo + pink jelly score capsule, then a stitched jar label holding the stats */
header{display:flex;flex-direction:column;gap:7px;padding-block:9px 2px;max-width:720px;width:100%;margin-inline:auto;box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{margin:0;font-size:min(1.28rem,4.4vw);font-weight:800;line-height:1.15;white-space:nowrap;letter-spacing:.01em}
.logo span{display:inline-block;--o:#fff;text-shadow:2px 0 var(--o),-2px 0 var(--o),0 2px var(--o),0 -2px var(--o),1.5px 1.5px var(--o),-1.5px 1.5px var(--o),1.5px -1.5px var(--o),-1.5px -1.5px var(--o),0 4px 0 var(--sh)}
.logo .l1{color:#28ade0;--sh:rgba(40,173,224,.32)}
.logo .l2{color:#ff5c96;--sh:rgba(255,92,150,.32);margin-left:1px}
.logo .l3{color:#ffad14;--sh:rgba(255,173,20,.4);transform:rotate(12deg);margin-left:2px;animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:rotate(12deg) translateY(0)}80%{transform:rotate(4deg) translateY(-5px)}90%{transform:rotate(16deg) translateY(0) scale(1.08,.92)}}
.score{position:relative;display:flex;align-items:center;gap:6px;padding:3px 14px 5px 7px;border-radius:999px;flex:none;
  background:linear-gradient(180deg,#ffb6d1,#ff7dab);border:2px solid #fff;box-shadow:0 3px 0 #e0518a,0 6px 14px rgba(224,81,138,.25),inset 0 -5px 8px rgba(190,30,95,.16)}
.score::before{content:'';position:absolute;left:14%;right:22%;top:2px;height:38%;border-radius:99px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,0));pointer-events:none}
.score small{position:relative;font-size:.62rem;font-weight:800;color:#fff;background:rgba(190,35,98,.32);border-radius:99px;padding:2px 7px}
.score b{position:relative;font-size:1.4rem;font-weight:800;line-height:1.1;color:#fff;text-shadow:0 2px 0 #cf3f78;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .12s}
.score.long{padding:3px 10px 5px 6px}.score.long b{font-size:min(1.05rem,4.3vw)}
.score b.bump{transform:scale(1.14,.88)}
.info{display:flex;align-items:stretch;background:var(--label);border-radius:16px;padding:5px 5px;box-shadow:0 3px 0 var(--btn-edge);outline:1.5px dashed var(--stitch);outline-offset:-4px}
.cell{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 5px;min-width:0}
.cell+.cell{border-left:1.5px dotted var(--btn-edge)}
.cell small{font-size:.58rem;font-weight:800;color:var(--ink-soft);line-height:1.2;white-space:nowrap}
.cell b{display:flex;align-items:center;gap:3px;font-size:.8rem;font-weight:800;color:var(--ink);line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell.nx b{font-size:.84rem}
.mini{display:inline-block;flex:none;width:15px;height:13px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.13);
  background:radial-gradient(circle at 34% 58%,#2f3b45 0 1.2px,transparent 1.6px),radial-gradient(circle at 66% 58%,#2f3b45 0 1.2px,transparent 1.6px),radial-gradient(circle at 28% 26%,rgba(255,255,255,.95) 0 1.7px,transparent 2.2px),var(--c,#7fd6f2)}
.mini.rb,.mini.top{--c:conic-gradient(#ff6b6b,#ffd93d,#6bcb77,#4dd6ff,#4d96ff,#c58cf0,#ff6b6b)}
.mini[hidden]{display:none}
#mute{align-self:center;flex:none;margin-inline:4px 2px;font:inherit;font-size:.62rem;font-weight:800;color:var(--ink-soft);background:var(--bg);border:1.5px solid var(--btn-edge);border-radius:99px;padding:3px 7px;cursor:pointer;white-space:nowrap}
@media (max-width:520px){.wide{display:none}}
@media (prefers-reduced-motion:reduce){.logo .l3{animation:none}}
#stage{flex:1;position:relative;min-height:0;touch-action:none}
#stagePill{position:absolute;left:8px;top:8px;z-index:1;display:flex;align-items:center;gap:6px;font-size:.66rem;font-weight:800;color:var(--ink);background:var(--btn);border:1.5px solid var(--btn-edge);border-bottom-width:3px;border-radius:99px;padding:3px 10px 3px 4px;pointer-events:none}
#stagePill i{width:18px;height:18px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1.5px #fff}
#stagePill em{display:block;width:54px;height:5px;border-radius:99px;background:var(--btn-edge);overflow:hidden}
#stagePill u{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb12e,#ff5d97);transition:width .3s}
#stagePill.last u{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c58cf0)}
#stagePill.pop{animation:pillPop .6s}
@keyframes pillPop{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.banner{position:absolute;left:50%;top:30%;z-index:3;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;min-width:230px;padding:14px 22px 16px;border-radius:26px;background:var(--btn);
  border:5px solid transparent;background-image:linear-gradient(var(--btn),var(--btn)),var(--sw);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 12px 30px rgba(0,0,0,.22);pointer-events:none;animation:bannerIn 2.6s forwards}
.banner small{font-size:.8rem;font-weight:800;letter-spacing:.2em;color:var(--ink-soft)}
.banner b{font-size:2.6rem;line-height:1;font-weight:800;color:#ff5d97;text-shadow:0 3px 0 rgba(224,81,138,.2)}
.banner span{font-size:1rem;font-weight:800;color:var(--ink);white-space:nowrap}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.wipe{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:150px 150px,100% 100%;animation:wipeIn .9s ease-in-out forwards}
@keyframes wipeIn{from{clip-path:circle(0% at 50% 40%)}to{clip-path:circle(150% at 50% 40%)}}
#end{position:absolute;right:8px;top:8px;z-index:1;font:inherit;font-size:.66rem;font-weight:800;color:var(--ink-soft);background:var(--btn);border:1.5px solid var(--btn-edge);border-bottom-width:3px;border-radius:99px;padding:4px 10px;cursor:pointer}
#end:focus-visible{outline:3px solid var(--ink-soft);outline-offset:2px}
.start .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.start .row .toy{font-size:1rem;padding:10px 18px}
.start .sub{background:var(--btn)}
.stlist{display:grid;gap:7px;width:100%}
.st{display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;color:var(--ink);background:var(--btn);border:2px solid var(--btn-edge);border-bottom-width:4px;border-radius:16px;padding:7px 10px;cursor:pointer}
.st .sw{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sw);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 0 0 2px #fff}
.st span{min-width:0}
.st b{display:block;font-size:.84rem;font-weight:800;line-height:1.25}
.st small{display:block;font-size:.66rem;color:var(--ink-soft);font-weight:700}
.st[aria-current="true"]{border-color:#ff7dab;background:var(--btn-on)}
.st:disabled{cursor:default;opacity:.55}
.st:disabled .sw{filter:grayscale(1) brightness(1.1)}
.st .new{margin-left:auto;flex:none;font-size:.62rem;font-weight:800;color:#fff;background:#ff5d97;border-radius:99px;padding:2px 7px}
.st:focus-visible,.start .toy:focus-visible{outline:3px solid var(--ink-soft);outline-offset:2px}
#cont:disabled{opacity:.45;cursor:default}
.start .final{font-size:2.6rem;font-weight:800;line-height:1.1;color:#ff5d97;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(224,81,138,.25)}
.start .newhi{font-size:.8rem;font-weight:800;color:#fff;background:linear-gradient(90deg,#ff6b6b,#ffb12e,#4dc56a,#4d96ff,#a77cf0);border-radius:99px;padding:3px 12px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:14%;transform:translate(-50%,0) scale(.9);background:var(--btn);color:var(--ink);border:2px solid var(--btn-edge);
  border-radius:99px;padding:6px 16px;font-weight:800;font-size:.95rem;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.yay{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);width:min(86%,340px);text-align:center;pointer-events:none;opacity:0;
  background:var(--btn);border-radius:28px;padding:18px 18px 16px;border:4px solid transparent;
  background-image:linear-gradient(var(--btn),var(--btn)),conic-gradient(#ff6b6b,#ffd93d,#6bcb77,#4dd6ff,#4d96ff,#c58cf0,#ff6b6b);
  background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.yay.show{animation:yay 3.6s cubic-bezier(.2,1.6,.4,1) forwards}
.yay small{display:block;font-size:.78rem;font-weight:800;color:var(--ink-soft);letter-spacing:.08em}
.yay strong{display:block;font-size:1.35rem;font-weight:800;line-height:1.4;margin-block:6px;color:var(--ink);text-wrap:balance}
.yay span{display:block;font-size:.85rem;color:var(--ink-soft)}
@keyframes yay{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}8%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
@media (prefers-reduced-motion: reduce){.yay.show{animation:none;opacity:1;transform:translate(-50%,-50%)}}
.start{position:absolute;inset:0;display:grid;place-items:center;background:var(--veil);padding-inline:16px;z-index:2}
.start .card{width:min(100%,340px);text-align:center;background:var(--btn);border-radius:28px;padding:22px 18px 18px;border:4px solid transparent;
  background-image:linear-gradient(var(--btn),var(--btn)),conic-gradient(#ff6b6b,#ffd93d,#6bcb77,#4dd6ff,#4d96ff,#c58cf0,#ff6b6b);
  background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;gap:8px;justify-items:center}
.start h2{margin:0;font-size:1.45rem;font-weight:800;text-wrap:balance}
.start p{margin:0;font-size:.85rem;color:var(--ink-soft)}
.start p b{color:var(--ink)}
.start .go{font-size:1.3rem;padding:12px 34px;margin-block:6px;border-radius:22px;background:var(--btn-on)}
.toy.go:hover{transform:translateY(-1px)}
#mc.bump{transform:scale(1.5);color:#ff8a3d}
#mc{display:inline-block;transition:transform .2s,color .2s}
.ladder{display:flex;justify-content:center;gap:6px;padding-block:6px 4px}
.ladder i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c);opacity:.45}
.ladder i.got{background:var(--c);opacity:1}
.ladder i.rainbow{--c:#c58cf0}
.ladder i.rainbow.got{background:conic-gradient(#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c58cf0,#ff6b6b)}
footer{display:flex;justify-content:center;gap:10px;padding-block:6px calc(12px + env(safe-area-inset-bottom,0px))}
.toy{font:inherit;font-weight:800;font-size:.85rem;color:var(--ink);background:var(--btn);border:2px solid var(--btn-edge);border-bottom-width:5px;border-radius:16px;
  padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .08s}
.toy:active{transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.toy[aria-pressed="true"]{background:var(--btn-on)}
.toy:disabled{opacity:.5;cursor:default}
.toy:focus-visible,#mute:focus-visible{outline:3px solid var(--ink-soft);outline-offset:2px}
.toy span{font-size:1.1rem}
@media (max-width:420px){.toy{font-size:.75rem;padding:7px 9px}}
@media (max-width:520px){footer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}footer .toy{flex-direction:column;gap:1px;font-size:.66rem;padding:5px 2px;white-space:nowrap;justify-content:center}}
</style>

</head>
<body>
<header class="pad">
  <div class="top">
    <h1 class="logo" aria-label="スライムうちまくれ！"><span class="l1">スライム</span><span class="l2">うちまくれ</span><span class="l3">！</span></h1>
    <div class="score"><small>点数</small><b id="score">0</b></div>
  </div>
  <div class="info">
    <span class="cell nx"><small>次</small><b><i class="mini" id="nextIco"></i><span id="next">ちびしずく</span></b></span>
    <span class="cell"><small>ハイスコア</small><b id="hi">0</b></span>
    <span class="cell"><small>最高連鎖</small><b id="mc">0</b></span>
    <span class="cell"><small>最高進化</small><b><i class="mini" id="bestIco"></i><span id="best" class="wide">—</span></b></span>
    <span class="cell"><small>虹</small><b><i class="mini rb"></i><span id="rain">0</span></b></span>
    <button id="mute" type="button">音 あり</button>
  </div>
</header>
<div id="stage"><canvas id="c"></canvas><div class="toast" id="toast"></div>
  <div class="start" id="start"><div class="card">
    <p>同じスライムをくっつけて育てよう</p>
    <h2>スライムうちまくれ！</h2>
    <p>目指せ 虹色のレインボーパール<br>虹どうしをくっつけると <b>フィーバー！</b><br>10回落とすと <b>連射</b>できる</p>
    <div class="row"><button class="toy go" id="cont" type="button">つづきから</button><button class="toy sub" id="fresh" type="button">さいしょから</button></div>
    <p>ハイスコア <b id="startHi">0</b>　最高連鎖 <b id="startMc">0</b></p>
  </div></div>
  <div class="start" id="reset" hidden><div class="card" role="dialog" aria-labelledby="resetQ">
    <h2 id="resetQ">さいしょからにする？</h2>
    <p>ハイスコア・最高連鎖・解放したステージが消えて<br>ステージ1からになります</p>
    <div class="row"><button class="toy go" id="resetYes" type="button">消してさいしょから</button><button class="toy sub" id="resetNo" type="button">やめる</button></div>
  </div></div>
  <div class="start" id="stages" hidden><div class="card" role="dialog" aria-labelledby="stT">
    <h2 id="stT">ステージをえらぶ</h2>
    <div class="stlist" id="stlist"></div>
    <button class="toy sub" id="stBack" type="button">もどる</button>
  </div></div>
  <button id="end" type="button" hidden>おわり</button>
  <div id="stagePill" hidden aria-live="polite"><i></i><span id="spName"></span><em><u id="spBar"></u></em></div>
  <div class="start" id="quit" hidden><div class="card" role="dialog" aria-labelledby="quitQ">
    <h2 id="quitQ">本当に終わりにする？</h2>
    <div class="row"><button class="toy go" id="quitYes" type="button">終わりにする</button><button class="toy sub" id="quitNo" type="button">つづける</button></div>
  </div></div>
  <div class="start" id="result" hidden><div class="card" role="dialog" aria-labelledby="resT">
    <h2 id="resT">おしまい！</h2>
    <p>今回のスコア</p>
    <div class="final" id="final">0</div>
    <span class="newhi" id="newhi" hidden>ハイスコア更新！</span>
    <button class="toy go" id="again" type="button">もういちど</button>
  </div></div>
</div>
<div class="ladder pad" id="ladder" aria-label="進化の流れ"></div>
<footer class="pad">
  <button class="toy storm" id="storm" type="button"><span aria-hidden="true">🌪️</span>ぐるぐる台風</button>
  <button class="toy storm" id="stormPop" type="button"><span aria-hidden="true">💥</span>ぎゅっとパーン</button>
  <button class="toy storm" id="stormCorn" type="button"><span aria-hidden="true">🍿</span>ポップコーン</button>
  <button class="toy" id="flip" type="button" aria-pressed="false"><span aria-hidden="true">🙃</span>重力反転</button></footer>

<script>
(()=>{
const {Engine,Bodies,Body,Composite,Events,Query}=Matter;
const LV=[{n:'ふしぎ玉',c:'#d9e2ec'},
  {n:'ちびしずく',c:'#7fd6f2'},{n:'マスカット',c:'#a8dc5a'},{n:'ピーチ',c:'#f7a1c4'},{n:'グレープ',c:'#a07ce0'},
  {n:'みかん',c:'#f9a03f'},{n:'ゴールドキング',c:'#e6b93a'},{n:'レインボーパール',c:'#c58cf0'}];
const MAX=LV.length-1,FEVER_MS=40000,FEVER_BIGS=5,FEVER_MULT=3;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

const queue=[];
function onPairs(e){
  if(!started)return; // after おわり the jar is frozen in time: no more merges or points
  for(const p of e.pairs){
    const a=p.bodyA,b=p.bodyB;if(a.label!=='slime'||b.label!=='slime')continue;
    if(e.name==='collisionStart'){const rv=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);
      a.plugin.amp=Math.min(.32,a.plugin.amp+rv*.022);b.plugin.amp=Math.min(.32,b.plugin.amp+rv*.022);if(rv>3)sBump(rv)}
    if(a.plugin.q||b.plugin.q)continue;
    const la=a.plugin.lv,lb=b.plugin.lv,wild=(la===0)!==(lb===0);
    if((la===lb&&la>0)||(wild&&Math.max(la,lb)<MAX)){a.plugin.q=b.plugin.q=true;queue.push([a,b])}
  }
}
